<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Contacto - AMA Pets</title>
</head>
<body>
    <div class="contenedor-centrado">
        <div class="tarjeta">
            <h1>Contacto</h1>
            <p style="color: #666; margin-bottom: 25px;">Cuéntanos cómo podemos ayudarte</p>

            <form id="formContacto" class="formulario-contacto">
                <label>Nombre:</label>
                <input type="text" id="nombre" placeholder="Tu nombre" required>

                <label>Correo:</label>
                <input type="email" id="email" placeholder="Tu email" required>

                <label>Mensaje:</label>
                <textarea id="mensaje" placeholder="Tu mensaje" rows="5" required></textarea>

                <button type="submit">Enviar</button>
            </form>

            <p id="respuesta" style="margin-top: 20px;"></p>

            <div style="margin-top: 25px; border-top: 1px solid #eee; padding-top: 20px;">
                <a href="inicio.html" class="redirecciones">Inicio</a>
                <a href="nosotros.html" class="redirecciones">Nosotros</a>
            </div>
        </div>
    </div>

    <script src="java.js"></script>
</body>
</html>
